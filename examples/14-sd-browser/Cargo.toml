[package]
name = "sd-browser"
description = "Browse the SD card, view text files and write a log file"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.citronnade]
since = "0.4"
title = "SD Browser"
covers = ["fs:USER", "SD card", "directories", "files"]

[package.metadata.citronnade.emulator]
frames = 200
input = ["120-122:x", "170-174:start"]
expect = ["free space:", "wrote and read back", "listing /citronnade-test", "sub/", "notes.txt", "first line of notes", "appended to"]
reject = ["error"]
exits = true
shots = [100]
sd_files = { "citronnade-test/notes.txt" = "first line of notes\nsecond line\nthird line\n", "citronnade-test/sub/inner.txt" = "inside a subdirectory\n" }

[dependencies]
citronnade.workspace = true
