[package]
name = "wifi-status"
description = "The Wi-Fi connection: state, access point, security, signal strength and the console's address"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.citronnade]
since = "0.8"
title = "Wi-Fi status"
covers = ["net::Network", "ac:u", "soc:U initialisation", "Network::local_ip"]

[package.metadata.citronnade.emulator]
frames = 100
input = ["80-84:start"]
expect = ["wifi-status: network up", "wifi:", "local address", "bye"]
reject = ["panicked"]
exits = true
shots = [40]

[dependencies]
citronnade.workspace = true
